<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Pro Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-feature-settings: "tnum" 1, "cv05" 1;
      font-variant-numeric: tabular-nums;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background-color: rgba(160, 160, 160, 0.25);
      border-radius: 9999px;
    }
    .key-btn {
      transition: background-color 0.12s ease, transform 0.08s ease;
    }
    .key-btn:active {
      transform: scale(0.965);
    }
    .unified-font {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="h-full bg-neutral-100 text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100 font-sans transition-colors duration-200 antialiased flex flex-col justify-center items-center p-3 sm:p-6 overflow-x-hidden">

  <main class="w-full max-w-4xl bg-white dark:bg-neutral-900/90 border border-neutral-200/80 dark:border-neutral-800 rounded-3xl shadow-xl flex flex-col md:flex-row overflow-hidden transition-all duration-300">
    
    <!-- Left Section: Main Calculator Core -->
    <div class="flex-1 flex flex-col p-5 sm:p-7">
      
      <!-- Top Control Bar -->
      <header class="flex items-center justify-between mb-4">
        <div class="flex items-center space-x-2">
          <span class="w-2 h-2 rounded-full bg-neutral-900 dark:bg-neutral-100"></span>
          <h1 class="text-xs font-semibold tracking-widest uppercase text-neutral-500 dark:text-neutral-400 unified-font">CALCULATOR</h1>
        </div>

        <div class="flex items-center gap-2">
          <!-- Toggle History Panel on Mobile -->
          <button onclick="calc.toggleDrawer()" class="md:hidden key-btn text-neutral-600 dark:text-neutral-300 p-1.5 rounded-lg border border-neutral-200 dark:border-neutral-800 hover:bg-neutral-100 dark:hover:bg-neutral-800" title="展开/收起历史">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </button>

          <!-- Theme Mode Switch -->
          <button id="themeToggle" onclick="calc.toggleTheme()" class="key-btn p-1.5 rounded-lg text-neutral-600 hover:text-neutral-900 dark:text-neutral-400 dark:hover:text-neutral-100 border border-neutral-200 dark:border-neutral-800 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition" title="切换深浅主题">
            <svg id="moonIcon" class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg id="sunIcon" class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </button>
        </div>
      </header>

      <!-- Strictly 2-Row Display Screen with identical font -->
      <section class="bg-neutral-50 dark:bg-neutral-950 border border-neutral-200/90 dark:border-neutral-800 rounded-2xl p-4 sm:p-5 mb-3 flex flex-col justify-center text-right overflow-hidden shadow-inner">
        <!-- Row 1: Expression Line (Input / Current Equation) -->
        <div id="expressionView" class="unified-font text-sm sm:text-base text-neutral-400 dark:text-neutral-500 font-normal tracking-wide h-6 truncate leading-6">
          &nbsp;
        </div>
        <!-- Row 2: Result Line (Calculation / Live Result) -->
        <div id="resultView" class="unified-font text-3xl sm:text-4xl font-semibold tracking-tight text-neutral-900 dark:text-neutral-100 h-11 truncate leading-11 mt-1">
          0
        </div>
      </section>

      <!-- Clipboard & Precision Format Utility Bar -->
      <div class="grid grid-cols-6 gap-1 sm:gap-1.5 mb-3 text-xs unified-font font-medium">
        <!-- Paste Button -->
        <button onclick="calc.pasteClipboard()" class="key-btn py-2 px-1 rounded-xl bg-neutral-100 dark:bg-neutral-800/80 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-200/80 dark:hover:bg-neutral-700/80 border border-neutral-200/70 dark:border-neutral-700/70 flex items-center justify-center gap-1" title="粘贴剪贴板算式或数值 (Ctrl+V)">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
          <span class="hidden sm:inline">粘贴</span>
        </button>

        <!-- New: Copy Result Only Button -->
        <button onclick="calc.copyResultOnly()" class="key-btn py-2 px-1 rounded-xl bg-neutral-900 text-white dark:bg-neutral-100 dark:text-neutral-900 hover:opacity-90 border border-neutral-800 dark:border-neutral-200 flex items-center justify-center gap-1 font-semibold" title="仅复制当前最终计算结果数值">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
          <span class="text-[11px] sm:text-xs">复制结果</span>
        </button>

        <!-- Copy Full Equation Button -->
        <button onclick="calc.copyFullEquation()" class="key-btn py-2 px-1 rounded-xl bg-neutral-100 dark:bg-neutral-800/80 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-200/80 dark:hover:bg-neutral-700/80 border border-neutral-200/70 dark:border-neutral-700/70 flex items-center justify-center gap-1" title="复制完整条件和结果 (如: 12 + 8 = 20)">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          <span class="text-[11px] sm:text-xs">复制全部</span>
        </button>

        <!-- Keep 2 Decimals -->
        <button onclick="calc.formatTwoDecimals()" class="key-btn py-2 px-1 rounded-xl bg-neutral-100 dark:bg-neutral-800/80 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-200/80 dark:hover:bg-neutral-700/80 border border-neutral-200/70 dark:border-neutral-700/70 flex items-center justify-center gap-1 font-semibold" title="保留两位小数">
          <span>.00</span>
          <span class="hidden sm:inline text-[11px] text-neutral-500">两位</span>
        </button>

        <!-- Round to Nearest Integer -->
        <button onclick="calc.formatRoundInteger()" class="key-btn py-2 px-1 rounded-xl bg-neutral-100 dark:bg-neutral-800/80 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-200/80 dark:hover:bg-neutral-700/80 border border-neutral-200/70 dark:border-neutral-700/70 flex items-center justify-center gap-0.5" title="四舍五入保留整数">
          <span>≈整</span>
          <span class="hidden sm:inline text-[11px] text-neutral-500">四舍</span>
        </button>

        <!-- Ceil Integer (进一法) -->
        <button onclick="calc.formatCeilInteger()" class="key-btn py-2 px-1 rounded-xl bg-neutral-100 dark:bg-neutral-800/80 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-200/80 dark:hover:bg-neutral-700/80 border border-neutral-200/70 dark:border-neutral-700/70 flex items-center justify-center gap-0.5 text-neutral-900 dark:text-neutral-100" title="进一法取整：只要有小数都加1 (如 1.0002 变为 2)">
          <span class="font-bold">↑整</span>
          <span class="hidden sm:inline text-[11px] text-neutral-500">进一</span>
        </button>
      </div>

      <!-- Keypad Grid (4 Columns) with Square & Cube Buttons -->
      <div class="grid grid-cols-4 gap-2 text-sm unified-font font-medium">
        <!-- Row 1: Clear, Delete, Modulo, Division -->
        <button onclick="calc.clearAll()" class="key-btn py-3.5 rounded-xl bg-neutral-200/80 dark:bg-neutral-800 text-neutral-900 dark:text-neutral-100 hover:bg-neutral-300/80 dark:hover:bg-neutral-700 font-semibold">AC</button>
        <button onclick="calc.deleteChar()" class="key-btn py-3.5 rounded-xl bg-neutral-200/80 dark:bg-neutral-800 text-neutral-900 dark:text-neutral-100 hover:bg-neutral-300/80 dark:hover:bg-neutral-700">⌫</button>
        <button onclick="calc.appendOp('%')" class="key-btn py-3.5 rounded-xl bg-neutral-100 dark:bg-neutral-800/70 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-200/70 dark:hover:bg-neutral-700">%</button>
        <button onclick="calc.appendOp('/')" class="key-btn py-3.5 rounded-xl bg-neutral-200/90 dark:bg-neutral-700 text-neutral-900 dark:text-neutral-100 hover:bg-neutral-300 dark:hover:bg-neutral-600 text-base">÷</button>

        <!-- Row 2: Square, Cube, Sqrt, Multiplication -->
        <button onclick="calc.square()" class="key-btn py-3.5 rounded-xl bg-neutral-100 dark:bg-neutral-800/70 text-neutral-800 dark:text-neutral-200 hover:bg-neutral-200/70 dark:hover:bg-neutral-700 font-semibold" title="计算平方 (x²)">x²</button>
        <button onclick="calc.cube()" class="key-btn py-3.5 rounded-xl bg-neutral-100 dark:bg-neutral-800/70 text-neutral-800 dark:text-neutral-200 hover:bg-neutral-200/70 dark:hover:bg-neutral-700 font-semibold" title="计算立方 (x³)">x³</button>
        <button onclick="calc.sqrt()" class="key-btn py-3.5 rounded-xl bg-neutral-100 dark:bg-neutral-800/70 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-200/70 dark:hover:bg-neutral-700 font-semibold" title="开平方根 (√)">√</button>
        <button onclick="calc.appendOp('*')" class="key-btn py-3.5 rounded-xl bg-neutral-200/90 dark:bg-neutral-700 text-neutral-900 dark:text-neutral-100 hover:bg-neutral-300 dark:hover:bg-neutral-600 text-base">×</button>

        <!-- Row 3: 7, 8, 9, Minus -->
        <button onclick="calc.appendNum('7')" class="key-btn py-3.5 rounded-xl bg-white dark:bg-neutral-800/90 text-neutral-900 dark:text-neutral-100 border border-neutral-200 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-700 font-semibold text-base">7</button>
        <button onclick="calc.appendNum('8')" class="key-btn py-3.5 rounded-xl bg-white dark:bg-neutral-800/90 text-neutral-900 dark:text-neutral-100 border border-neutral-200 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-700 font-semibold text-base">8</button>
        <button onclick="calc.appendNum('9')" class="key-btn py-3.5 rounded-xl bg-white dark:bg-neutral-800/90 text-neutral-900 dark:text-neutral-100 border border-neutral-200 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-700 font-semibold text-base">9</button>
        <button onclick="calc.appendOp('-')" class="key-btn py-3.5 rounded-xl bg-neutral-200/90 dark:bg-neutral-700 text-neutral-900 dark:text-neutral-100 hover:bg-neutral-300 dark:hover:bg-neutral-600 text-base">−</button>

        <!-- Row 4: 4, 5, 6, Plus -->
        <button onclick="calc.appendNum('4')" class="key-btn py-3.5 rounded-xl bg-white dark:bg-neutral-800/90 text-neutral-900 dark:text-neutral-100 border border-neutral-200 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-700 font-semibold text-base">4</button>
        <button onclick="calc.appendNum('5')" class="key-btn py-3.5 rounded-xl bg-white dark:bg-neutral-800/90 text-neutral-900 dark:text-neutral-100 border border-neutral-200 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-700 font-semibold text-base">5</button>
        <button onclick="calc.appendNum('6')" class="key-btn py-3.5 rounded-xl bg-white dark:bg-neutral-800/90 text-neutral-900 dark:text-neutral-100 border border-neutral-200 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-700 font-semibold text-base">6</button>
        <button onclick="calc.appendOp('+')" class="key-btn py-3.5 rounded-xl bg-neutral-200/90 dark:bg-neutral-700 text-neutral-900 dark:text-neutral-100 hover:bg-neutral-300 dark:hover:bg-neutral-600 text-base">+</button>

        <!-- Row 5: 1, 2, 3, Parentheses -->
        <button onclick="calc.appendNum('1')" class="key-btn py-3.5 rounded-xl bg-white dark:bg-neutral-800/90 text-neutral-900 dark:text-neutral-100 border border-neutral-200 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-700 font-semibold text-base">1</button>
        <button onclick="calc.appendNum('2')" class="key-btn py-3.5 rounded-xl bg-white dark:bg-neutral-800/90 text-neutral-900 dark:text-neutral-100 border border-neutral-200 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-700 font-semibold text-base">2</button>
        <button onclick="calc.appendNum('3')" class="key-btn py-3.5 rounded-xl bg-white dark:bg-neutral-800/90 text-neutral-900 dark:text-neutral-100 border border-neutral-200 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-700 font-semibold text-base">3</button>
        <div class="grid grid-cols-2 gap-1">
          <button onclick="calc.appendBracket('(')" class="key-btn py-3.5 rounded-xl bg-neutral-100 dark:bg-neutral-800/70 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-200/70 dark:hover:bg-neutral-700">(</button>
          <button onclick="calc.appendBracket(')')" class="key-btn py-3.5 rounded-xl bg-neutral-100 dark:bg-neutral-800/70 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-200/70 dark:hover:bg-neutral-700">)</button>
        </div>

        <!-- Row 6: ±, 0, ., Equals -->
        <button onclick="calc.toggleSign()" class="key-btn py-3.5 rounded-xl bg-neutral-100 dark:bg-neutral-800/70 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-200/70 dark:hover:bg-neutral-700">±</button>
        <button onclick="calc.appendNum('0')" class="key-btn py-3.5 rounded-xl bg-white dark:bg-neutral-800/90 text-neutral-900 dark:text-neutral-100 border border-neutral-200 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-700 font-semibold text-base">0</button>
        <button onclick="calc.appendDot()" class="key-btn py-3.5 rounded-xl bg-white dark:bg-neutral-800/90 text-neutral-900 dark:text-neutral-100 border border-neutral-200 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-700 font-semibold text-base">.</button>
        <button onclick="calc.executeResult()" class="key-btn py-3.5 rounded-xl bg-neutral-900 hover:bg-black dark:bg-neutral-100 dark:hover:bg-white text-white dark:text-neutral-950 font-semibold text-lg shadow-sm">
          =
        </button>
      </div>

      <!-- Footer Info -->
      <footer class="mt-4 pt-3 border-t border-neutral-100 dark:border-neutral-800/80 text-[11px] text-neutral-400 dark:text-neutral-500 flex justify-between items-center unified-font">
        <span>支持键盘输入与快捷键粘贴 (Ctrl/Cmd + V)</span>
        <span>Minimalist Engine</span>
      </footer>
    </div>

    <!-- Right Section: History Drawer -->
    <aside id="historyDrawer" class="w-full md:w-80 bg-neutral-50/90 dark:bg-neutral-900 border-t md:border-t-0 md:border-l border-neutral-200/80 dark:border-neutral-800 flex flex-col p-5">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-neutral-200/80 dark:border-neutral-800">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-neutral-500 dark:text-neutral-400 flex items-center gap-1.5 unified-font">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          计算历史
        </h2>
        <div class="flex items-center gap-2">
          <button onclick="calc.copyAllHistory()" class="text-xs text-neutral-400 hover:text-neutral-900 dark:hover:text-neutral-200 transition unified-font" title="复制所有历史条目">
            复制全部
          </button>
          <button onclick="calc.clearHistory()" class="text-xs text-neutral-400 hover:text-neutral-900 dark:hover:text-neutral-200 transition unified-font">
            清空
          </button>
        </div>
      </div>

      <!-- History Items -->
      <div id="historyList" class="flex-1 custom-scroll overflow-y-auto space-y-2 pr-1 max-h-56 md:max-h-[420px]">
        <div class="text-center py-12 text-xs text-neutral-400 dark:text-neutral-600 unified-font">
          暂无计算记录
        </div>
      </div>
    </aside>

  </main>

  <!-- Monochrome Feedback Toast -->
  <div id="toast" class="fixed bottom-6 bg-neutral-900 text-white dark:bg-neutral-100 dark:text-neutral-900 px-4 py-2 rounded-full text-xs font-medium unified-font shadow-lg opacity-0 transition-opacity duration-200 pointer-events-none z-50">
    已复制
  </div>

  <script>
    class MinimalistCalculator {
      constructor() {
        this.expr = '';
        this.result = '0';
        this.lastCompletedExpr = '';
        this.lastCompletedResult = '0';
        this.history = [];
        this.hasEvaluated = false;

        this.initTheme();
        this.loadHistory();
        this.setupKeyboard();
        this.updateDisplay();
      }

      initTheme() {
        const saved = localStorage.getItem('calc_mono_theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }

      toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('calc_mono_theme', isDark ? 'dark' : 'light');
      }

      toggleDrawer() {
        const drawer = document.getElementById('historyDrawer');
        drawer.classList.toggle('hidden');
      }

      showToast(text = '已完成') {
        const toast = document.getElementById('toast');
        toast.textContent = text;
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 1600);
      }

      copyToClipboard(text) {
        if (!text) return;
        const el = document.createElement('textarea');
        el.value = text;
        el.setAttribute('readonly', '');
        el.style.position = 'absolute';
        el.style.left = '-9999px';
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
      }

      async pasteClipboard() {
        let text = '';
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            text = await navigator.clipboard.readText();
          }
        } catch (e) {
          // fallback
        }

        if (!text) {
          text = prompt('请在此粘贴需要计算的算式或数值：');
        }

        if (!text) return;

        let cleaned = text.trim()
          .replace(/[，,]/g, '')
          .replace(/×/g, '*')
          .replace(/÷/g, '/')
          .replace(/[—–]/g, '-')
          .replace(/（/g, '(')
          .replace(/）/g, ')')
          .replace(/\s+/g, '');

        if (cleaned.includes('=')) {
          const parts = cleaned.split('=');
          cleaned = parts[0].trim() || parts[1].trim();
        }

        cleaned = cleaned.replace(/[^0-9+\-*/.()^%]/g, '');

        if (!cleaned) {
          this.showToast('未能识别有效算式');
          return;
        }

        if (this.hasEvaluated) {
          this.expr = '';
          this.hasEvaluated = false;
        }

        this.expr += cleaned;
        this.triggerRealtimeEvaluation();
        this.updateDisplay();
        this.showToast('已成功粘贴');
      }

      // 仅复制最终计算结果
      copyResultOnly() {
        let res = '0';
        if (this.lastCompletedResult && this.lastCompletedResult !== '0') {
          res = this.lastCompletedResult;
        } else if (this.result && this.result !== 'Error') {
          res = this.result;
        } else if (this.expr) {
          try {
            res = String(this.evaluateExpression(this.expr));
          } catch {
            res = '0';
          }
        }
        this.copyToClipboard(res);
        this.showToast('已复制结果: ' + res);
      }

      copyFullEquation() {
        let eq = '';
        if (this.lastCompletedExpr && this.lastCompletedResult) {
          eq = `${this.lastCompletedExpr} = ${this.lastCompletedResult}`;
        } else if (this.expr) {
          eq = `${this.expr} = ${this.result}`;
        } else if (this.result !== '0') {
          eq = `${this.result}`;
        } else {
          eq = '0 = 0';
        }
        this.copyToClipboard(eq);
        this.showToast('已复制全部: ' + eq);
      }

      copyAllHistory() {
        if (!this.history.length) {
          this.showToast('暂无历史记录');
          return;
        }
        const text = this.history.map(item => `${item.expr} = ${item.res}`).join('\n');
        this.copyToClipboard(text);
        this.showToast(`已复制全部 ${this.history.length} 条历史`);
      }

      appendNum(num) {
        if (this.hasEvaluated) {
          this.expr = '';
          this.hasEvaluated = false;
        }
        this.expr += num;
        this.triggerRealtimeEvaluation();
        this.updateDisplay();
      }

      appendDot() {
        if (this.hasEvaluated) {
          this.expr = '0';
          this.hasEvaluated = false;
        }
        const tokens = this.expr.split(/[\+\-\*\/\^\(\)]/);
        const lastToken = tokens[tokens.length - 1];
        if (!lastToken.includes('.')) {
          this.expr += (lastToken === '' ? '0.' : '.');
          this.triggerRealtimeEvaluation();
          this.updateDisplay();
        }
      }

      appendOp(op) {
        if (this.hasEvaluated) {
          this.hasEvaluated = false;
        }
        if (!this.expr && op === '-') {
          this.expr = '-';
          this.updateDisplay();
          return;
        }
        if (/[+\-*/%]$/.test(this.expr)) {
          this.expr = this.expr.slice(0, -1) + op;
        } else if (this.expr) {
          this.expr += op;
        }
        this.triggerRealtimeEvaluation();
        this.updateDisplay();
      }

      appendBracket(b) {
        if (this.hasEvaluated) {
          this.hasEvaluated = false;
        }
        this.expr += b;
        this.triggerRealtimeEvaluation();
        this.updateDisplay();
      }

      toggleSign() {
        if (!this.expr && this.result !== '0') {
          this.expr = this.result;
        }
        if (!this.expr) return;

        if (this.expr.startsWith('-(') && this.expr.endsWith(')')) {
          this.expr = this.expr.slice(2, -1);
        } else {
          this.expr = `-(${this.expr})`;
        }
        this.triggerRealtimeEvaluation();
        this.updateDisplay();
      }

      deleteChar() {
        if (this.hasEvaluated) {
          this.clearAll();
          return;
        }
        this.expr = this.expr.slice(0, -1);
        this.triggerRealtimeEvaluation();
        this.updateDisplay();
      }

      clearAll() {
        this.expr = '';
        this.result = '0';
        this.lastCompletedExpr = '';
        this.lastCompletedResult = '0';
        this.hasEvaluated = false;
        this.updateDisplay();
      }

      square() {
        let targetExpr = this.expr.trim();
        if (!targetExpr && this.result !== '0' && this.result !== 'Error') {
          targetExpr = this.result;
        }
        if (!targetExpr) return;

        try {
          const val = this.evaluateExpression(targetExpr);
          const computed = val * val;
          const formatted = this.formatNumber(computed);
          
          this.lastCompletedExpr = `(${targetExpr})²`;
          this.lastCompletedResult = formatted;
          this.addHistory(this.lastCompletedExpr, formatted);

          this.expr = formatted;
          this.result = formatted;
          this.hasEvaluated = true;
          this.updateDisplay();
        } catch (e) {
          this.result = 'Error';
          this.updateDisplay();
        }
      }

      cube() {
        let targetExpr = this.expr.trim();
        if (!targetExpr && this.result !== '0' && this.result !== 'Error') {
          targetExpr = this.result;
        }
        if (!targetExpr) return;

        try {
          const val = this.evaluateExpression(targetExpr);
          const computed = val * val * val;
          const formatted = this.formatNumber(computed);

          this.lastCompletedExpr = `(${targetExpr})³`;
          this.lastCompletedResult = formatted;
          this.addHistory(this.lastCompletedExpr, formatted);

          this.expr = formatted;
          this.result = formatted;
          this.hasEvaluated = true;
          this.updateDisplay();
        } catch (e) {
          this.result = 'Error';
          this.updateDisplay();
        }
      }

      sqrt() {
        let targetExpr = this.expr.trim();
        if (!targetExpr && this.result !== '0' && this.result !== 'Error') {
          targetExpr = this.result;
        }
        if (!targetExpr) return;

        try {
          const val = this.evaluateExpression(targetExpr);
          if (val < 0) {
            this.result = 'Error';
            this.updateDisplay();
            return;
          }
          const computed = Math.sqrt(val);
          const formatted = this.formatNumber(computed);

          this.lastCompletedExpr = `√(${targetExpr})`;
          this.lastCompletedResult = formatted;
          this.addHistory(this.lastCompletedExpr, formatted);

          this.expr = formatted;
          this.result = formatted;
          this.hasEvaluated = true;
          this.updateDisplay();
        } catch (e) {
          this.result = 'Error';
          this.updateDisplay();
        }
      }

      formatTwoDecimals() {
        try {
          let currentVal = this.hasEvaluated || !this.expr ? parseFloat(this.result) : this.evaluateExpression(this.expr);
          if (!Number.isFinite(currentVal)) return;

          const formatted = (Math.round((currentVal + Number.EPSILON) * 100) / 100).toFixed(2);
          
          this.lastCompletedExpr = `${this.expr || this.result} [.00]`;
          this.lastCompletedResult = formatted;
          this.addHistory(this.lastCompletedExpr, formatted);

          this.expr = formatted;
          this.result = formatted;
          this.hasEvaluated = true;
          this.updateDisplay();
          this.showToast('已保留两位小数: ' + formatted);
        } catch (e) {
          this.showToast('无法格式化');
        }
      }

      formatRoundInteger() {
        try {
          let currentVal = this.hasEvaluated || !this.expr ? parseFloat(this.result) : this.evaluateExpression(this.expr);
          if (!Number.isFinite(currentVal)) return;

          const formatted = String(Math.round(currentVal));
          
          this.lastCompletedExpr = `round(${this.expr || this.result})`;
          this.lastCompletedResult = formatted;
          this.addHistory(this.lastCompletedExpr, formatted);

          this.expr = formatted;
          this.result = formatted;
          this.hasEvaluated = true;
          this.updateDisplay();
          this.showToast('四舍五入: ' + formatted);
        } catch (e) {
          this.showToast('无法取整');
        }
      }

      formatCeilInteger() {
        try {
          let currentVal = this.hasEvaluated || !this.expr ? parseFloat(this.result) : this.evaluateExpression(this.expr);
          if (!Number.isFinite(currentVal)) return;

          const formatted = String(Math.ceil(currentVal));

          this.lastCompletedExpr = `ceil(${this.expr || this.result})`;
          this.lastCompletedResult = formatted;
          this.addHistory(this.lastCompletedExpr, formatted);

          this.expr = formatted;
          this.result = formatted;
          this.hasEvaluated = true;
          this.updateDisplay();
          this.showToast('进一法取整: ' + formatted);
        } catch (e) {
          this.showToast('无法取整');
        }
      }

      evaluateExpression(raw) {
        if (!raw || raw.trim() === '') return 0;
        let s = raw.trim();

        s = s.replace(/×/g, '*').replace(/÷/g, '/');

        s = s.replace(/(\d)(\()/g, '$1*$2');         s = s.replace(/(\))(\d)/g, '$1*$2');
        s = s.replace(/(\))(\()/g, '$1*$2');          s = s.replace(/(\d+(\.\d+)?)\%/g, '($1/100)');          while (s.includes('^')) {           const powRegex = /([0-9.]+\vert{}\([^\(\)]+\))\^([0-9.]+|\([^\(\)]+\))/;
          if (!powRegex.test(s)) break;
          s = s.replace(powRegex, 'Math.pow($1,$2)');
        }

        const sanitized = s.replace(/[^-()\d/*+%. Mathpow]/g, '');
        const evaluator = new Function(`"use strict"; return (${sanitized});`);

        const val = evaluator();
        if (!Number.isFinite(val)) throw new Error('无效运算');

        return parseFloat(val.toFixed(12));
      }

      formatNumber(val) {
        if (!Number.isFinite(val)) return 'Error';
        if (Math.abs(val) > 1e12 || (Math.abs(val) > 0 && Math.abs(val) < 1e-7)) {
          return val.toExponential(6);
        }
        return String(Number(val.toFixed(10)));
      }

      triggerRealtimeEvaluation() {
        if (!this.expr) {
          this.result = '0';
          return;
        }
        try {
          const val = this.evaluateExpression(this.expr);
          this.result = this.formatNumber(val);
        } catch {
          // 保持即时预览稳定
        }
      }

      executeResult() {
        if (!this.expr) return;
        try {
          const val = this.evaluateExpression(this.expr);
          const formatted = this.formatNumber(val);
          this.lastCompletedExpr = this.expr;
          this.lastCompletedResult = formatted;
          this.addHistory(this.expr, formatted);
          this.result = formatted;
          this.expr = formatted;
          this.hasEvaluated = true;
        } catch (e) {
          this.result = 'Error';
        }
        this.updateDisplay();
      }

      updateDisplay() {
        const exprEl = document.getElementById('expressionView');
        const resEl = document.getElementById('resultView');

        exprEl.textContent = this.expr || '\u00A0';
        resEl.textContent = this.result || '0';
      }

      addHistory(expression, result) {
        this.history.unshift({
          expr: expression,
          res: result,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        if (this.history.length > 25) this.history.pop();
        this.saveHistory();
        this.renderHistory();
      }

      saveHistory() {
        localStorage.setItem('calc_mono_history', JSON.stringify(this.history));
      }

      loadHistory() {
        const data = localStorage.getItem('calc_mono_history');
        this.history = data ? JSON.parse(data) : [];
        this.renderHistory();
      }

      clearHistory() {
        this.history = [];
        this.saveHistory();
        this.renderHistory();
        this.showToast('历史已清空');
      }

      renderHistory() {
        const container = document.getElementById('historyList');
        if (this.history.length === 0) {
          container.innerHTML = `<div class="text-center py-12 text-xs text-neutral-400 dark:text-neutral-600 unified-font">暂无计算记录</div>`;
          return;
        }

        container.innerHTML = this.history.map((item, idx) => `
          <div onclick="calc.recallHistory(${idx})" class="group p-2.5 rounded-xl hover:bg-neutral-200/50 dark:hover:bg-neutral-800/60 transition cursor-pointer border border-transparent hover:border-neutral-200 dark:hover:border-neutral-700">
            <div class="flex justify-between items-center text-[11px] text-neutral-400 dark:text-neutral-500 unified-font">
              <span class="truncate max-w-[150px]">${item.expr}</span>
              <span class="flex items-center gap-1.5">
                <span>${item.time}</span>
                <!-- 快捷复制纯结果 -->
                <button onclick="event.stopPropagation(); calc.copyToClipboard('${item.res}'); calc.showToast('已复制结果: ${item.res}')" class="opacity-0 group-hover:opacity-100 hover:text-neutral-900 dark:hover:text-neutral-100 transition p-0.5" title="复制纯结果">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </button>
              </span>
            </div>
            <div class="text-sm unified-font font-medium text-neutral-800 dark:text-neutral-200 text-right mt-0.5">
              = ${item.res}
            </div>
          </div>
        `).join('');
      }

      recallHistory(index) {
        const item = this.history[index];
        if (!item) return;
        this.expr = item.res;
        this.result = item.res;
        this.hasEvaluated = false;
        this.updateDisplay();
      }

      setupKeyboard() {
        document.addEventListener('keydown', (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
            return;
          }
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
            this.copyResultOnly();
            return;
          }

          if (e.key >= '0' && e.key <= '9') {
            this.appendNum(e.key);
          } else if (['+', '-', '*', '/'].includes(e.key)) {
            this.appendOp(e.key);
          } else if (e.key === '.') {
            this.appendDot();
          } else if (e.key === '(' || e.key === ')') {
            this.appendBracket(e.key);
          } else if (e.key === 'Enter' || e.key === '=') {
            e.preventDefault();
            this.executeResult();
          } else if (e.key === 'Backspace') {
            e.preventDefault();
            this.deleteChar();
          } else if (e.key === 'Escape') {
            this.clearAll();
          } else if (e.key === '%') {
            this.appendOp('%');
          }
        });

        window.addEventListener('paste', (e) => {
          const text = (e.clipboardData || window.clipboardData).getData('text');
          if (text) {
            e.preventDefault();
            let cleaned = text.trim()
              .replace(/[，,]/g, '')
              .replace(/×/g, '*')
              .replace(/÷/g, '/')
              .replace(/[—–]/g, '-')
              .replace(/（/g, '(')
              .replace(/）/g, ')')
              .replace(/\s+/g, '');
            if (cleaned.includes('=')) {
              cleaned = cleaned.split('=')[0].trim();
            }
            cleaned = cleaned.replace(/[^0-9+\-*/.()^%]/g, '');
            if (cleaned) {
              if (this.hasEvaluated) {
                this.expr = '';
                this.hasEvaluated = false;
              }
              this.expr += cleaned;
              this.triggerRealtimeEvaluation();
              this.updateDisplay();
              this.showToast('已从剪贴板粘贴');
            }
          }
        });
      }
    }

    const calc = new MinimalistCalculator();
  </script>
</body>
